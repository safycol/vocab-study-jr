<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語句学習</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent:       #4f46e5;
      --accent-light: #eef2ff;
      --text:         #1a202c;
      --text-sub:     #718096;
      --border:       #e2e8f0;
      --bg:           #f7f8fc;
      --radius:       14px;
    }
    body {
      font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─── */
    .header {
      background: linear-gradient(135deg, var(--accent) 0%, #6d28d9 100%);
      color: white;
      padding: 16px 16px 0;
      transition: background 0.3s;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .app-title { font-size: 17px; font-weight: 700; }
    .date-text  { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .streak-box {
      text-align: center;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 6px 12px;
    }
    .streak-num   { font-size: 20px; font-weight: 800; }
    .streak-label { font-size: 10px; opacity: 0.9; }

    /* ── Subject tabs ─── */
    .subject-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .subject-tabs::-webkit-scrollbar { display: none; }
    .subject-tab {
      flex-shrink: 0;
      background: rgba(255,255,255,0.2);
      border: none;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .subject-tab.active {
      background: white;
      color: var(--accent);
    }

    /* ── Progress ─── */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .progress-bar  { flex: 1; background: rgba(255,255,255,0.3); border-radius: 6px; height: 6px; overflow: hidden; }
    .progress-fill { background: white; height: 100%; border-radius: 6px; transition: width 0.4s; }
    .progress-text { font-size: 12px; opacity: 0.9; white-space: nowrap; }

    /* ── View tabs ─── */
    .view-tabs { display: flex; gap: 4px; }
    .view-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.65);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 4px;
      cursor: pointer;
      position: relative;
      transition: color 0.18s;
    }
    .view-tab.active { color: white; }
    .view-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: white;
      border-radius: 3px 3px 0 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f59e0b;
      color: white;
      font-size: 10px;
      font-weight: 700;
      border-radius: 10px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* ── Views ─── */
    .view { display: none; padding: 14px; }
    .view.active { display: block; }

    /* ── Cards ─── */
    .card {
      background: white;
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 1.5px solid transparent;
      animation: slideIn 0.28s ease both;
    }
    .card.marked { border-color: #f59e0b; background: #fffbeb; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-8px); }
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }
    .word-block { flex: 1; }
    .word     { font-size: 26px; font-weight: 800; }
    .reading  { font-size: 13px; color: var(--text-sub); margin-top: 3px; font-family: monospace; }
    .cat-tag  {
      display: inline-block;
      margin-top: 5px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-light);
      padding: 2px 8px;
      border-radius: 20px;
    }
    .review-btn {
      flex-shrink: 0;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.18s;
    }
    .review-btn:hover { border-color: #f59e0b; color: #f59e0b; }
    .review-btn.marked { background: #f59e0b; border-color: #f59e0b; color: white; }
    .meaning {
      font-size: 15px;
      font-weight: 600;
      background: #f7f8fc;
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .card.marked .meaning { background: rgba(255,255,255,0.7); }
    .ex-label { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .example  { font-size: 13px; color: #4a5568; line-height: 1.7; }
    .example-ja { color: #718096; font-style: italic; margin-top: 3px; font-size: 12px; }

    /* ── Next batch ─── */
    .next-wrap { text-align: center; padding: 6px 0 20px; }
    .next-btn {
      background: white;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      padding: 11px 26px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .next-btn:hover { background: var(--accent); color: white; }
    .next-btn:disabled { border-color: var(--border); color: var(--text-sub); cursor: default; }
    .next-btn:disabled:hover { background: white; color: var(--text-sub); }
    .pool-status { text-align: center; font-size: 12px; color: var(--text-sub); margin-top: 10px; }

    /* ── Review list ─── */
    .review-count { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 14px; }
    .review-empty { text-align: center; padding: 50px 20px; color: var(--text-sub); }
    .review-empty .icon { font-size: 44px; margin-bottom: 10px; }
    .review-empty p { font-size: 14px; line-height: 1.7; }
    .rcard {
      background: white;
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 12px;
      border-left: 4px solid var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      animation: slideIn 0.28s ease both;
    }
    .rcard-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .rcard-word    { font-size: 22px; font-weight: 800; }
    .rcard-reading { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .done-btn {
      flex-shrink: 0;
      background: white;
      border: 1.5px solid #22c55e;
      color: #22c55e;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .done-btn:hover { background: #22c55e; color: white; }
    .rcard-meaning  { font-size: 14px; font-weight: 600; margin-bottom: 8px; line-height: 1.6; }
    .rcard-example  { font-size: 12px; color: #4a5568; line-height: 1.7; }
    .rcard-exja     { color: #718096; font-style: italic; margin-top: 3px; }
    .rcard-tag      {
      display: inline-block;
      margin-top: 8px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-light);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .footer { text-align: center; font-size: 12px; color: var(--text-sub); padding: 8px 0 24px; }
  </style>
</head>
<body>

<div class="header" id="header">
  <div class="header-row">
    <div>
      <div class="app-title">語句学習</div>
      <div class="date-text">2026年5月20日</div>
    </div>
    <div class="streak-box">
      <div class="streak-num" id="streak-num">0</div>
      <div class="streak-label">日連続</div>
    </div>
  </div>

  <div class="subject-tabs" id="subject-tabs"></div>

  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text"></div>
  </div>

  <div class="view-tabs">
    <button class="view-tab active" onclick="switchView('today')">今日の語句</button>
    <button class="view-tab" onclick="switchView('review')" id="review-tab">
      復習リスト<span class="badge" id="badge" style="display:none">0</span>
    </button>
  </div>
</div>

<div id="today-view" class="view active">
  <div id="cards"></div>
  <div class="pool-status" id="pool-status"></div>
  <div class="next-wrap"><button class="next-btn" id="next-btn" onclick="showNextBatch()">次の語句を見る →</button></div>
  <div class="footer">毎日の積み重ねが力になる 💪</div>
</div>

<div id="review-view" class="view">
  <div id="review-container"></div>
</div>

eaning": "技術、科学技術", "example": "Technology makes our daily life more convenient.", "example_ja": "技術は私たちの日常生活をより便利にする。", "category": "名詞"}, "20": {"id": 20, "subject": "英語", "word": "culture", "reading": "ˈkʌltʃər", "meaning": "文化", "example": "Learning about other cultures is interesting.", "example_ja": "他の文化について学ぶことは興味深い。", "category": "名詞"}, "21": {"id": 21, "subject": "英語", "word": "especially", "reading": "ɪˈspeʃəli", "meaning": "特に、とりわけ", "example": "I like sports, especially swimming.", "example_ja": "私はスポーツが好きで、特に水泳が好きだ。", "category": "副詞"}, "22": {"id": 22, "subject": "英語", "word": "already", "reading": "ɔːlˈredi", "meaning": "すでに、もう", "example": "I have already finished my homework.", "example_ja": "私はもう宿題を終わらせた。", "category": "副詞"}, "23": {"id": 23, "subject": "英語", "word": "enough", "reading": "ɪˈnʌf", "meaning": "十分な、十分に", "example": "Make sure you get enough sleep.", "example_ja": "十分な睡眠をとるようにしてください。", "category": "形容詞・副詞"}, "24": {"id": 24, "subject": "英語", "word": "surprised", "reading": "səˈpraɪzd", "meaning": "驚いた", "example": "I was surprised to hear the news.", "example_ja": "私はそのニュースを聞いて驚いた。", "category": "形容詞"}, "25": {"id": 25, "subject": "英語", "word": "translate", "reading": "trænsˈleɪt", "meaning": "〜を翻訳する", "example": "Can you translate this sentence into Japanese?", "example_ja": "この文を日本語に翻訳してくれますか？", "category": "動詞"}, "26": {"id": 26, "subject": "英語", "word": "society", "reading": "səˈsaɪəti", "meaning": "社会", "example": "We all have a role to play in society.", "example_ja": "私たちは皆、社会で果たすべき役割がある。", "category": "名詞"}, "27": {"id": 27, "subject": "英語", "word": "creative", "reading": "kriˈeɪtɪv", "meaning": "創造的な、独創的な", "example": "She has a very creative mind.", "example_ja": "彼女はとても創造的な思考を持っている。", "category": "形容詞"}, "28": {"id": 28, "subject": "英語", "word": "support", "reading": "səˈpɔːt", "meaning": "〜を支援する、支える", "example": "Friends support each other in difficult times.", "example_ja": "友人は困難な時に互いを支え合う。", "category": "動詞・名詞"}, "29": {"id": 29, "subject": "英語", "word": "receive", "reading": "rɪˈsiːv", "meaning": "〜を受け取る", "example": "I received a letter from my pen pal.", "example_ja": "私はペンパルから手紙を受け取った。", "category": "動詞"}, "30": {"id": 30, "subject": "英語", "word": "produce", "reading": "prəˈdjuːs", "meaning": "〜を生産する、作り出す", "example": "This factory produces about 1,000 cars a day.", "example_ja": "この工場は1日に約1,000台の車を生産する。", "category": "動詞"}, "31": {"id": 31, "subject": "国語", "word": "誠実", "reading": "せいじつ", "meaning": "真心を持って、まじめに物事に取り組む様子", "example": "誠実な態度が相手の信頼を得ることにつながる。", "example_ja": "", "category": "性格・人物表現"}, "32": {"id": 32, "subject": "国語", "word": "謙虚", "reading": "けんきょ", "meaning": "控えめで素直なこと。自分を偉いと思わない態度", "example": "どんなに成功しても謙虚さを忘れないことが大切だ。", "example_ja": "", "category": "性格・人物表現"}, "33": {"id": 33, "subject": "国語", "word": "矛盾", "reading": "むじゅん", "meaning": "二つの物事が食い違い、両立しないこと", "example": "彼の言っていることとやっていることは矛盾している。", "example_ja": "", "category": "論理・文章表現"}, "34": {"id": 34, "subject": "国語", "word": "根拠", "reading": "こんきょ", "meaning": "判断や主張のよりどころとなる理由・事実", "example": "意見を言うときは、必ず根拠を示すことが大切だ。", "example_ja": "", "category": "論理・文章表現"}, "35": {"id": 35, "subject": "国語", "word": "要約", "reading": "ようやく", "meaning": "文章の要点を短くまとめること", "example": "この長い文章を3行に要約してみよう。", "example_ja": "", "category": "論理・文章表現"}, "36": {"id": 36, "subject": "国語", "word": "象徴", "reading": "しょうちょう", "meaning": "抽象的な考えや感情を、具体的なものや形で表すこと", "example": "ハトは平和の象徴として世界中で知られている。", "example_ja": "", "category": "文学表現"}, "37": {"id": 37, "subject": "国語", "word": "情景", "reading": "じょうけい", "meaning": "感情を呼び起こすような場面や景色", "example": "この詩は秋の情景を美しく描いている。", "example_ja": "", "category": "文学表現"}, "38": {"id": 38, "subject": "国語", "word": "心情", "reading": "しんじょう", "meaning": "心の中にある感情・気持ち", "example": "登場人物の心情を読み取ることが読解の基本だ。", "example_ja": "", "category": "文学表現"}, "39": {"id": 39, "subject": "国語", "word": "主題", "reading": "しゅだい", "meaning": "文章や作品が伝えようとする中心的なテーマ・メッセージ", "example": "この小説の主題は「人と人とのつながり」だと考えられる。", "example_ja": "", "category": "文学表現"}, "40": {"id": 40, "subject": "国語", "word": "批判", "reading": "ひはん", "meaning": "物事の良し悪しを判断して指摘すること（否定とは違う）", "example": "相手の意見を批判するときは、感情的にならないようにしよう。", "example_ja": "", "category": "論理・文章表現"}, "41": {"id": 41, "subject": "国語", "word": "比較", "reading": "ひかく", "meaning": "二つ以上のものを比べること", "example": "二つの作品を比較することで、それぞれの特徴が見えてくる。", "example_ja": "", "category": "論理・文章表現"}, "42": {"id": 42, "subject": "国語", "word": "抽象", "reading": "ちゅうしょう", "meaning": "具体的な形を持たない、概念的なもの", "example": "「自由」や「愛」は抽象的な言葉の例だ。", "example_ja": "", "category": "論理・文章表現"}, "43": {"id": 43, "subject": "国語", "word": "具体", "reading": "ぐたい", "meaning": "形や内容がはっきりしていること。実際の事例", "example": "説明するときは具体的な例を挙げると伝わりやすい。", "example_ja": "", "category": "論理・文章表現"}, "44": {"id": 44, "subject": "国語", "word": "逆説", "reading": "ぎゃくせつ", "meaning": "一見矛盾するようで、実は正しい主張や言い方", "example": "「急がば回れ」は逆説的な表現の一例だ。", "example_ja": "", "category": "修辞・表現技法"}, "45": {"id": 45, "subject": "国語", "word": "皮肉", "reading": "ひにく", "meaning": "遠回しに相手を批判したり嘲ったりする言い方", "example": "「よくそんな発言ができますね」という皮肉を込めた一言だった。", "example_ja": "", "category": "修辞・表現技法"}, "46": {"id": 46, "subject": "国語", "word": "普遍", "reading": "ふへん", "meaning": "時代や場所を問わず、どんな場合にも共通して当てはまること", "example": "「人は誰かに必要とされたい」という気持ちは普遍的だ。", "example_ja": "", "category": "論理・文章表現"}, "47": {"id": 47, "subject": "国語", "word": "継続", "reading": "けいぞく", "meaning": "途切れずに続けること", "example": "継続は力なり——毎日少しずつ続けることが大切だ。", "example_ja": "", "category": "性格・人物表現"}, "48": {"id": 48, "subject": "国語", "word": "敬意", "reading": "けいい", "meaning": "相手を尊い者として大切にする気持ち", "example": "年上の人に対して敬意を持って接することが礼儀だ。", "example_ja": "", "category": "性格・人物表現"}, "49": {"id": 49, "subject": "国語", "word": "努力", "reading": "どりょく", "meaning": "目標に向かって力を尽くすこと", "example": "結果が出なくても、努力した過程に意味がある。", "example_ja": "", "category": "性格・人物表現"}, "50": {"id": 50, "subject": "国語", "word": "挑戦", "reading": "ちょうせん", "meaning": "難しいことや新しいことに果敢に取り組むこと", "example": "失敗を恐れずに挑戦することが成長につながる。", "example_ja": "", "category": "性格・人物表現"}};
const TODAY_POOLS  = {"英語": [23, 29, 12, 18, 8, 9, 6, 1, 24, 28, 30, 16, 26, 17, 13, 4, 20, 11, 19, 5], "国語": [42, 32, 44, 31, 34, 49, 35, 46, 36, 33, 43, 37, 45, 39, 40, 48, 50, 38, 47, 41]};
const STREAKS      = {"英語": 5, "国語": 5};
const STATS        = {"英語": {"introduced": 30, "total": 30}, "国語": {"introduced": 20, "total": 20}};
const SUBJECTS     = ["英語", "国語"];
const SUBJECT_CFG  = {"英語": {"emoji": "🇬🇧", "color": "#4f46e5", "light": "#eef2ff"}, "国語": {"emoji": "📖", "color": "#dc2626", "light": "#fef2f2"}, "社会": {"emoji": "🌍", "color": "#16a34a", "light": "#f0fdf4"}, "理科": {"emoji": "🔬", "color": "#d97706", "light": "#fffbeb"}, "数学": {"emoji": "📐", "color": "#7c3aed", "light": "#f5f3ff"}};
const TODAY_DATE   = '2026-05-20';
const BATCH_SIZE   = 4;

const DEFAULT_CFG  = {color:"#6b7280", light:"#f9fafb", emoji:"📚"};

// ── State ────────────────────────────────────────────────────────
let currentSubject = localStorage.getItem('jr_subject') || SUBJECTS[0];
if (!SUBJECTS.includes(currentSubject)) currentSubject = SUBJECTS[0];

function cfg(s) { return SUBJECT_CFG[s] || DEFAULT_CFG; }

function reviewKey(s) { return `jr_review_${s}_v1`; }
function shownKey(s)  { return `jr_shown_${s}_v1`; }
function dateKey(s)   { return `jr_date_${s}_v1`; }

function getReview(s) {
  return new Set(JSON.parse(localStorage.getItem(reviewKey(s)) || '[]'));
}
function saveReview(s, set) {
  localStorage.setItem(reviewKey(s), JSON.stringify([...set]));
}
function getShown(s) {
  if (localStorage.getItem(dateKey(s)) !== TODAY_DATE) {
    localStorage.setItem(dateKey(s), TODAY_DATE);
    localStorage.setItem(shownKey(s), '0');
    return 0;
  }
  return parseInt(localStorage.getItem(shownKey(s)) || '0');
}
function setShown(s, n) {
  localStorage.setItem(shownKey(s), String(n));
}

// ── Theme ─────────────────────────────────────────────────────────
function applyTheme(s) {
  const c = cfg(s);
  document.documentElement.style.setProperty('--accent',       c.color);
  document.documentElement.style.setProperty('--accent-light', c.light);
  document.getElementById('header').style.background =
    `linear-gradient(135deg, ${c.color} 0%, ${shadeColor(c.color, -30)} 100%)`;
}
function shadeColor(hex, pct) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (num>>16) + pct));
  const g = Math.min(255, Math.max(0, ((num>>8)&0xFF) + pct));
  const b = Math.min(255, Math.max(0, (num&0xFF) + pct));
  return '#' + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// ── Subject selector ─────────────────────────────────────────────
function buildSubjectTabs() {
  const container = document.getElementById('subject-tabs');
  SUBJECTS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'subject-tab' + (s === currentSubject ? ' active' : '');
    btn.textContent = (cfg(s).emoji || '') + ' ' + s;
    btn.onclick = () => switchSubject(s);
    container.appendChild(btn);
  });
}
function switchSubject(s) {
  currentSubject = s;
  localStorage.setItem('jr_subject', s);
  document.querySelectorAll('.subject-tab').forEach((b,i) => {
    b.classList.toggle('active', SUBJECTS[i] === s);
  });
  applyTheme(s);
  updateHeader();
  document.getElementById('cards').innerHTML = '';
  shownCountForSubject = getShown(s);
  if (shownCountForSubject > 0) {
    const ids = (TODAY_POOLS[s] || []).slice(0, shownCountForSubject);
    ids.forEach((id, i) => {
      const card = makeCard(id, s);
      if (card) { card.style.animation='none'; document.getElementById('cards').appendChild(card); }
    });
  } else {
    showNextBatch();
  }
  updatePoolStatus();
  updateBadge();
  if (document.getElementById('review-view').classList.contains('active')) renderReview();
}

// ── Header info ──────────────────────────────────────────────────
function updateHeader() {
  const s = currentSubject;
  document.getElementById('streak-num').textContent = STREAKS[s] || 0;
  const st = STATS[s] || {introduced:0, total:1};
  const pct = Math.round(st.introduced / st.total * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent =
    `${st.introduced}/${st.total}語 (${pct}%)`;
}

// ── View tabs ────────────────────────────────────────────────────
function switchView(v) {
  document.querySelectorAll('.view-tab').forEach((b,i) => b.classList.toggle('active', i===(v==='today'?0:1)));
  document.getElementById('today-view').classList.toggle('active', v==='today');
  document.getElementById('review-view').classList.toggle('active', v==='review');
  if (v === 'review') renderReview();
}
function updateBadge() {
  const n = getReview(currentSubject).size;
  const badge = document.getElementById('badge');
  badge.textContent = n;
  badge.style.display = n > 0 ? 'inline-flex' : 'none';
}

// ── Card factory ─────────────────────────────────────────────────
function makeCard(id, subj) {
  const w = ALL_VOCAB[String(id)];
  if (!w) return null;
  const rev = getReview(subj);
  const marked = rev.has(id);
  const el = document.createElement('div');
  el.className = 'card' + (marked ? ' marked' : '');
  el.id = 'card-' + id;
  const exJa = w.example_ja ? `<div class="example-ja">${w.example_ja}</div>` : '';
  el.innerHTML = `
    <div class="card-header">
      <div class="word-block">
        <div class="word">${w.word}</div>
        <div class="reading">${w.reading || ''}</div>
        <div class="cat-tag">${w.category || ''}</div>
      </div>
      <button class="review-btn ${marked?'marked':''}" id="rbtn-${id}" onclick="toggleReview(${id})">
        ${marked ? '📌 復習中' : '＋ 要復習'}
      </button>
    </div>
    <div class="meaning">${w.meaning}</div>
    <div class="ex-label">使用例</div>
    <div class="example">${w.example}${exJa}</div>`;
  return el;
}
function toggleReview(id) {
  const s = currentSubject;
  const rev = getReview(s);
  const btn = document.getElementById('rbtn-' + id);
  const card = document.getElementById('card-' + id);
  if (rev.has(id)) {
    rev.delete(id);
    btn.className = 'review-btn'; btn.textContent = '＋ 要復習';
    card.classList.remove('marked');
  } else {
    rev.add(id);
    btn.className = 'review-btn marked'; btn.textContent = '📌 復習中';
    card.classList.add('marked');
  }
  saveReview(s, rev);
  updateBadge();
}

// ── Batch ────────────────────────────────────────────────────────
let shownCountForSubject = 0;
function showNextBatch() {
  const s = currentSubject;
  const pool = TODAY_POOLS[s] || [];
  const batch = pool.slice(shownCountForSubject, shownCountForSubject + BATCH_SIZE);
  if (!batch.length) return;
  const container = document.getElementById('cards');
  batch.forEach((id, i) => {
    const card = makeCard(id, s);
    if (card) { card.style.animationDelay = (i * 0.07) + 's'; container.appendChild(card); }
  });
  shownCountForSubject += batch.length;
  setShown(s, shownCountForSubject);
  updatePoolStatus();
}
function updatePoolStatus() {
  const s = currentSubject;
  const pool = TODAY_POOLS[s] || [];
  const remaining = pool.length - shownCountForSubject;
  const statusEl = document.getElementById('pool-status');
  const nextBtn  = document.getElementById('next-btn');
  if (shownCountForSubject > 0) statusEl.textContent = `本日の語句: ${shownCountForSubject} / ${pool.length} 語 表示済み`;
  if (remaining <= 0) {
    nextBtn.disabled = true;
    nextBtn.textContent = '本日分はすべて表示しました';
    statusEl.textContent = `${pool.length} / ${pool.length} 語 表示済み — 明日も続けよう！`;
  } else {
    nextBtn.disabled = false;
    nextBtn.textContent = `次の語句を見る (${Math.min(BATCH_SIZE, remaining)}語) →`;
  }
}

// ── Review list ──────────────────────────────────────────────────
function renderReview() {
  const s = currentSubject;
  const container = document.getElementById('review-container');
  container.innerHTML = '';
  const rev = getReview(s);
  if (!rev.size) {
    container.innerHTML = `<div class="review-empty"><div class="icon">📖</div>
      <p>復習リストはまだ空です。<br>語句カードの「＋ 要復習」ボタンで<br>気になった語句を追加しよう！</p></div>`;
    return;
  }
  const count = document.createElement('div');
  count.className = 'review-count';
  count.textContent = `復習リスト: ${rev.size} 語`;
  container.appendChild(count);
  rev.forEach(id => {
    const w = ALL_VOCAB[String(id)]; if (!w) return;
    const exJa = w.example_ja ? `<div class="rcard-exja">${w.example_ja}</div>` : '';
    const el = document.createElement('div');
    el.className = 'rcard'; el.id = 'rcard-' + id;
    el.style.borderColor = cfg(s).color;
    el.innerHTML = `
      <div class="rcard-header">
        <div><div class="rcard-word">${w.word}</div><div class="rcard-reading">${w.reading||''}</div></div>
        <button class="done-btn" onclick="markDone(${id})">覚えた ✓</button>
      </div>
      <div class="rcard-meaning">${w.meaning}</div>
      <div class="rcard-example">${w.example}${exJa}</div>
      <div class="rcard-tag">${w.category||''}</div>`;
    container.appendChild(el);
  });
}
function markDone(id) {
  const el = document.getElementById('rcard-' + id);
  el.style.animation = 'fadeOut 0.28s ease forwards';
  setTimeout(() => {
    const s = currentSubject;
    const rev = getReview(s); rev.delete(id); saveReview(s, rev);
    updateBadge();
    const btn  = document.getElementById('rbtn-' + id);
    const card = document.getElementById('card-' + id);
    if (btn)  { btn.className = 'review-btn'; btn.textContent = '＋ 要復習'; }
    if (card) card.classList.remove('marked');
    renderReview();
  }, 260);
}

// ── Init ─────────────────────────────────────────────────────────
buildSubjectTabs();
applyTheme(currentSubject);
updateHeader();
shownCountForSubject = getShown(currentSubject);
if (shownCountForSubject > 0) {
  (TODAY_POOLS[currentSubject]||[]).slice(0, shownCountForSubject).forEach(id => {
    const card = makeCard(id, currentSubject);
    if (card) { card.style.animation='none'; document.getElementById('cards').appendChild(card); }
  });
  updatePoolStatus();
} else {
  showNextBatch();
}
updateBadge();
</script>
