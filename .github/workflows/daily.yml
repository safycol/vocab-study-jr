name: 毎日の語句ページ生成

on:
  schedule:
    - cron: '0 22 * * *'  # 毎朝7時（日本時間）
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 今日の語句ページを生成
        run: python study.py --no-browser
        env:
          CI: "true"
          TZ: Asia/Tokyo
      - name: コミット & プッシュ
        run: |
          git config user.name  "vocab-bot"
          git config user.email "vocab-bot@users.noreply.github.com"
          git add index.html progress.json
          git diff --staged --quiet && exit 0
          git commit -m "vocab: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
